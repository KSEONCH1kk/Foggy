# One Foggy JAR targets Spigot/Paper 1.8.x, 1.16-1.21 and Paper/Folia 26+.
# Run the server on the Java version required by that server; Foggy itself is Java 8 bytecode.
# PacketEvents 2.13.0 is required.
visibility:
  radius-blocks: 128.0
  spatial-cell-size: 16
  # 1 = hide on the first confirmed server tick. Raise to 2 only if wall-edge jitter
  # is more important than the extra hiding delay. Showing is never debounced.
  hide-confirmation-ticks: 1
  use-fov: true

fov:
  # Minecraft's configured FOV is a vertical perspective angle. It is unavailable
  # to an unmodified server, so fallback poses use this value plus the margin.
  fallback-vertical-degrees: 70.0
  conservative-margin-degrees: 20.0
  fallback-aspect-ratio: 1.7777778

camera:
  # Vanilla third-person camera distance is 4 * entity scale before clipping.
  fallback-third-person-distance: 4.0
  distance-samples: 4
  source-margin-blocks: 0.10
  include-front-third-person: true
  include-back-third-person: true

raycast:
  # Samples previous/current client-interpolation positions. 3 means t=0, .5, 1.
  interpolation-samples: 3
  endpoint-epsilon: 0.0001
  cache:
    # Block state/shape is invalidated immediately by vanilla Bukkit block events. This periodic
    # validation also catches direct WorldEdit/NMS/plugin writes that bypass those events.
    validation-ticks: 20
    # Sparse compensated chunk sections not crossed by a ray for this long are evicted.
    retention-ticks: 600
    # Reuse an optical result while viewer/target/cameras and world revision are unchanged.
    # Movement, view rotation and block events invalidate it immediately; 20 only bounds direct
    # NMS/plugin edits that bypass every block event.
    decision-ticks: 20
  # Visibility uses native, state-dependent geometry: the 1.8 collision AABB collector or
  # 1.16+ VoxelShape boxes. This includes stairs, slabs, fences, walls, signs, ladders, etc.
  # "pass-through" still intersects these shapes, but listed translucent materials do not
  # terminate the ray. Use "occlude" if glass/leaves must behave like opaque blockers.
  transparent-block-mode: pass-through
  # Case-insensitive Bukkit Material names. '*' is supported anywhere in a value.
  transparent-materials:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - WATER
    - STATIONARY_WATER
    - LAVA
    - STATIONARY_LAVA
    - BUBBLE_COLUMN
    - GLASS
    - "*_STAINED_GLASS"
    - STAINED_GLASS
    - TINTED_GLASS
    - GLASS_PANE
    - THIN_GLASS
    - "*_STAINED_GLASS_PANE"
    - STAINED_GLASS_PANE
    - ICE
    - PACKED_ICE
    - FROSTED_ICE
    - SLIME_BLOCK
    - HONEY_BLOCK
    - LEAVES
    - LEAVES_2
    - "*_LEAVES"
    - PORTAL
    - ENDER_PORTAL
    - NETHER_PORTAL
    - END_PORTAL
    - END_GATEWAY
    - BARRIER
    - STRUCTURE_VOID
    - LIGHT
    - BEACON
  # The built-in catalog starts with all 280 relevant CUTOUT/CUTOUT_MIPPED/TRIPWIRE
  # registrations from the official 1.21.4 client and adds legacy/future material families.
  # Fences and gates are included because their rendered gaps are finer than server shapes.
  cutout-block-mode: pass-through
  cutout-materials:
    - FENCE
    - NETHER_FENCE
    - FENCE_GATE
    - COBBLE_WALL
    - "*_FENCE"
    - "*_FENCE_GATE"
  # Evaluated before both lists. Example: [OAK_DOOR, TINTED_GLASS, "*_LEAVES"]
  # forces selected materials to stop rays while other transparent/cutout entries pass.
  opaque-material-overrides: []

invisibility:
  # Keep ordinary invisible entities client-side. Vanilla metadata hides the body while
  # armor/held items remain rendered and attack interaction keeps working. Spectator,
  # Bukkit hide/vanish and supported vanish APIs still remove the complete entity.
  preserve-vanilla-entity: true
  potion-effect: true
  entity-invisible-flag: true
  spectator: true
  respect-bukkit-can-see: true
  reflective-vanish-hooks: true

companion:
  enabled: true
  channel: foggy:camera
  sample-ttl-millis: 1500
  max-camera-offset-blocks: 5.0
  min-fov-degrees: 10.0
  max-fov-degrees: 150.0
